<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">US Lolbeans server Web</title>
    <link rel="icon" type="image/png" href="images/download.png">
    <link rel="stylesheet" href="css/styles.css?v=20261107-button-hover-v6">
    <style>
        /* Language Switcher Styling - Locked to Far Left */
        .language-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 8px 0;
            margin: 0;
            margin-left: 0 !important;
            padding-left: 0 !important;
            position: relative;
            z-index: 1000;
        }

        .language-dropdown {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .lang-btn:hover {
            background-color: #333;
            border-color: #666;
        }

        .lang-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            min-width: 200px;
            max-height: 320px;
            overflow-y: auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            padding: 4px 0;
            margin: 0;
            list-style: none;
        }

        .lang-menu.open {
            display: block;
        }

        .lang-option {
            width: 100%;
            background: none;
            border: none;
            color: #f1f1f1;
            text-align: left;
            padding: 9px 14px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lang-option:hover {
            background-color: #333;
        }

        .lang-option.active {
            background-color: #2b4c7e;
            font-weight: bold;
        }
    </style>
</head>

                <li><button type="button" class="lang-option" data-lang="pt">Português</button></li>

    <script>
        const o = document.getElementById('offline-screen');
        const check = () => o.style.display = navigator.onLine ? 'none' : 'flex';
        window.addEventListener('online', check);
        window.addEventListener('offline', check);
        check();
