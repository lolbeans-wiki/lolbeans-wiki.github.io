<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="bouncyAlekPageTitle">Bouncy Alek - US Lolbeans server Web</title>
    <link rel="icon" type="image/png" href="images/download.png">
    <link rel="stylesheet" href="css/styles.css?v=20261107-button-hover-v6">
</head>
<body class="fun-thingies-active" data-rain-image="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png">

    <div id="bouncy-sub-panel" class="sub-screen-panel">
        <a class="back-button-top" href="extras.html" data-i18n="backToExtras">Back to Extras</a>
        <div class="bouncy-world" style="margin-top: 50px;">
            <div class="alek-dancer slow-bounce slow-one" aria-hidden="true"><img src="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png" alt=""><span class="bean-eye bean-eye-left"><span class="bean-pupil"></span></span><span class="bean-eye bean-eye-right"><span class="bean-pupil"></span></span></div>
            <div class="alek-dancer slow-bounce slow-two" aria-hidden="true"><img src="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png" alt=""><span class="bean-eye bean-eye-left"><span class="bean-pupil"></span></span><span class="bean-eye bean-eye-right"><span class="bean-pupil"></span></span></div>
            <div class="alek-dancer slow-bounce slow-three" aria-hidden="true"><img src="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png" alt=""><span class="bean-eye bean-eye-left"><span class="bean-pupil"></span></span><span class="bean-eye bean-eye-right"><span class="bean-pupil"></span></span></div>
            <div class="alek-dancer slow-crossing slow-crossing-one" aria-hidden="true"><img src="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png" alt=""><span class="bean-eye bean-eye-left"><span class="bean-pupil"></span></span><span class="bean-eye bean-eye-right"><span class="bean-pupil"></span></span></div>
            <div class="alek-dancer slow-crossing slow-crossing-two" aria-hidden="true"><img src="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png" alt=""><span class="bean-eye bean-eye-left"><span class="bean-pupil"></span></span><span class="bean-eye bean-eye-right"><span class="bean-pupil"></span></span></div>

            <div class="alek-widget dont-clek-widget">
                <p data-i18n="dontClekMe">dont clek me</p>
                <button class="alek-dancer" id="click-explosion-alek" type="button" aria-label="Click to reveal the latest image" data-i18n-aria="clickRevealAria"><img class="alek-image" src="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png" alt=""><span class="bean-eye bean-eye-left"><span class="bean-pupil"></span></span><span class="bean-eye bean-eye-right"><span class="bean-pupil"></span></span></button>
            </div>

            <div class="fast-bounce-box" aria-hidden="true">
                <div class="alek-dancer"><img draggable="false" src="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png" alt=""><span class="bean-eye bean-eye-left"><span class="bean-pupil"></span></span><span class="bean-eye bean-eye-right"><span class="bean-pupil"></span></span></div>
            </div>

            <div class="alek-widget thanky-widget">
                <p id="thanky-message" aria-live="polite" data-i18n="clickMe">Click me</p>
                <button class="alek-dancer" id="thanky-alek" type="button" aria-label="Click Alek to stop him" data-i18n-aria="clickStopAria"><img src="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png" alt=""><span class="bean-eye bean-eye-left"><span class="bean-pupil"></span></span><span class="bean-eye bean-eye-right"><span class="bean-pupil"></span></span></button>
            </div>

            <div class="alek-widget spin-widget">
                <button class="alek-dancer" id="spin-alek" type="button" aria-label="Click Alek to spin faster" data-i18n-aria="clickSpinAria"><img class="alek-image" src="images/Screenshot%202026-10-29%20at%201.31.29%20AM.png" alt=""><span class="bean-eye bean-eye-left"><span class="bean-pupil"></span></span><span class="bean-eye bean-eye-right"><span class="bean-pupil"></span></span></button>
            </div>
        </div>
    </div>
    <!-- Background Music Audio Loop -->
    <audio id="bg-music" src="audio/bg-music.mp3" loop preload="auto"></audio>

    <script src="js/bean-lock.js"></script>
    <script src="js/bouncy-alek.js"></script>
    <script src="js/common.js"></script>
</body>
</html>
