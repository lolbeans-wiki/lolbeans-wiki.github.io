<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat - LolBeans Stats</title>
    <link rel="icon" type="image/png" href="images/download.png">
    <link rel="stylesheet" href="css/styles.css?v=20261105-local-online-counter">
</head>
<body class="live-chat-page">
    <main class="live-chat-shell">
        <a class="live-chat-back" href="extras.html">Back to Extras</a>
        <h1 class="live-chat-title">Live Chat</h1>
        <form class="live-chat-nickname-form" id="live-chat-nickname-form">
            <label for="live-chat-nickname">Your nickname</label>
            <div class="live-chat-nickname-controls">
                <input id="live-chat-nickname" name="nickname" type="text" maxlength="32" autocomplete="nickname" placeholder="Your nickname" required>
                <button type="submit">Join Chat</button>
            </div>
        </form>
        <div class="live-chat-chat-layout">
            <div class="live-chat-frame" id="live-chat-frame">
                <p class="live-chat-prompt" id="live-chat-prompt">Choose a nickname to join the chat.</p>
                <div class="live-chat-mask live-chat-mask-header" aria-hidden="true"></div>
                <div class="live-chat-mask live-chat-mask-sidebar" aria-hidden="true"></div>
            </div>
            <aside class="live-chat-presence" aria-label="Online count">
                <span class="live-chat-presence-count" id="live-chat-presence-count" aria-live="polite">0</span>
                <span class="live-chat-presence-label">online</span>
            </aside>
        </div>
    </main>
    <script src="js/live-chat.js"></script>
    <script src="js/live-chat-presence.js"></script>
</body>
</html>
