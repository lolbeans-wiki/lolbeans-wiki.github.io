<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="funFactTitle">Fun fact Generator - US Lolbeans server Web</title>
    <link rel="icon" type="image/png" href="images/download.png">
    <link rel="stylesheet" href="css/styles.css?v=20261107-button-hover-v6">
</head>
<body class="fun-thingies-active">

    <div id="fact-sub-panel" class="sub-screen-panel">
        <a class="back-button-top" href="extras.html" data-i18n="backToExtras">Back to Extras</a>
        <div class="fact-content">
            <button type="button" id="generate-fact-btn" data-i18n="generateFactBtn">Generate fun fact</button>
            <div id="fact-box" class="fact-box" hidden>
                <h3 class="fact-title" data-i18n="funFactHeading">Fun fact</h3>
                <p class="fact-text"><span id="fact-text"></span><span id="fact-timer" class="fact-timer" hidden></span></p>
                <img id="fact-image" class="fact-image" alt="" hidden>
                <button type="button" id="fact-cookie" class="fact-cookie" aria-label="Open the lucky bean cookie" data-i18n-aria="luckyCookieAria" hidden></button>
                <p id="fact-cookie-msg" class="fact-cookie-msg" aria-live="polite" hidden></p>
            </div>
        </div>
    </div>

    <script src="js/bean-lock.js"></script>
    <script src="js/fun-fact.js"></script>
    <script src="js/common.js"></script>
</body>
</html>
