.character-gallery {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: flex-start;
}

.row-floor-line {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: #fff;
    pointer-events: none;
    z-index: 2;
}

.character-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.character-wrapper .achievement-tooltip {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    white-space: normal;
    max-width: 220px;
    width: max-content;
    text-align: center;
    word-wrap: break-word;
    z-index: 10;
}

.character-wrapper:hover .achievement-tooltip {
    display: block;
}

.tier-bots {
    gap: 10px;
}

.tier-bots .character-wrapper {
    transform: scale(0.85);
    transform-origin: top center;
}

.tier-bots .player-name-tag {
    font-size: 0.85em;
}

.tier-bots .gallery-icon {
    max-width: 70px;
    max-height: 70px;
}

.tier-bots .achievement-tooltip {
    font-size: 0.75em;
    padding: 4px 8px;
    max-width: 150px;
}

const root = document.getElementById('roster-root');
let out = '';

for (const group in roster) {
    out += `<div class="tier-container"><h2 class="section-role-title">${group}</h2><div class="character-gallery tier-${group.toLowerCase()}">`;

    for (const person of roster[group]) {
        const pic = person.placeholder
            ? '<div class="gallery-icon placeholder-box"></div>'
            : `<img src="${person.img}" alt="${person.name}" class="gallery-icon">`;

        out += `
            <div class="character-wrapper"${person.id ? ` id="${person.id}"` : ''}>
                <div class="player-name-tag">${person.name}</div>
                ${pic}
                <div class="achievement-tooltip">${person.msg}</div>
            </div>
        `;
    }

    out += '</div></div>';
    if (group !== 'Bots') out += '<hr class="tier-separator">';
}

root.innerHTML = out;

function drawRowLines() {
    document.querySelectorAll('.row-floor-line').forEach(el => el.remove());

    document.querySelectorAll('.character-gallery').forEach(gallery => {
        const cards = Array.from(gallery.querySelectorAll('.character-wrapper'));
        const seenTops = [];

        for (const card of cards) {
            const top = card.offsetTop;
            if (!seenTops.some(t => Math.abs(t - top) < 8)) {
                seenTops.push(top);
                const line = document.createElement('div');
                line.className = 'row-floor-line';
                line.style.top = (top - 15) + 'px';
                gallery.appendChild(line);
            }
        }
    });
}

window.addEventListener('load', drawRowLines);
window.addEventListener('resize', drawRowLines);
drawRowLines();

    masterCard.onmouseleave = () => {
        masterSong.pause();
        masterSong.currentTime = 0;
